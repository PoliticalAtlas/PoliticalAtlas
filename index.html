<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Political Atlas</title>

  <!-- 1. Includi il CSS di Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <!-- 2. Includi il JS di Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    /* Assicuriamoci che html/body siano al 100% per far funzionare width:100% */
    html, body { margin:0; padding:0; height:100%; }
    #map { width:100%; height:600px; }
    /* Posizione per la legenda */
    #legend {
      position: absolute;
      bottom: 30px; left: 10px;
      background: white;
      padding: 10px;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      z-index: 1000;
    }
  </style>
</head>

<body>
  <!-- 3. Contenitore per la mappa -->
  <div id="map"></div>

  <!-- 4. Legenda -->
  <div id="legend">
    <b>Legenda</b><br/>
    <span style="background:#800000;display:inline-block;width:18px;height:18px"></span> Estrema sinistra<br/>
    <span style="background:#FF0000;display:inline-block;width:18px;height:18px"></span> Sinistra<br/>
    <span style="background:#9CA3AF;display:inline-block;width:18px;height:18px"></span> Altro<br/>
    <span style="background:#0000FF;display:inline-block;width:18px;height:18px"></span> Destra<br/>
    <span style="background:#000080;display:inline-block;width:18px;height:18px"></span> Estrema destra
  </div>

  <!-- 5. Script per la mappa e GeoJSON -->
  <script>
    // 5.1 Crea la mappa dentro #map
    var map = L.map('map').setView([20, 0], 2);

    // 5.2 Aggiungi lo sfondo OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 5.3 Funzione per i colori
    function getColor(cat) {
      if (cat === 'estrema_sinistra') return '#800000';
      if (cat === 'sinistra')        return '#FF0000';
      if (cat === 'altro')           return '#9CA3AF';
      if (cat === 'destra')          return '#0000FF';
      if (cat === 'estrema_destra')  return '#000080';
      return '#FFFFFF';
    }

    // 5.4 Carica e disegna il GeoJSON
    fetch('data/world.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: feature => ({
            fillColor: getColor(feature.properties.orientation),
            weight: 1, color: 'white', fillOpacity: 0.7
          }),
          onEachFeature: (feature, layer) => {
            layer.bindPopup(
              feature.properties.name +
              '<br>Orientamento: ' +
              feature.properties.orientation
            );
          }
        }).addTo(map);
      })
      .catch(err => console.error('Errore caricamento GeoJSON:', err));
  </script>
</body>
</html>
